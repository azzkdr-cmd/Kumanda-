name: APK

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: APK derle
        run: ./gradlew --no-daemon assembleRelease -Pvc=${{ github.run_number }}
      - run: cp app/build/outputs/apk/release/app-release.apk Kumanda.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Kumanda-apk
          path: Kumanda.apk
      - name: Surum yayinla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Kumanda v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: Kumanda.apk
